name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install 3.13
      - name: Lint
        run: |
          uv venv
          uv pip install ruff
          uv run ruff check src tests
          uv run ruff format --check src tests

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install 3.13

      # CI has no GPU, so install CPU-only PyTorch instead of the project's
      # default CUDA index. The CUDA wheels are also several GB larger.
      - name: Install dependencies
        run: |
          uv venv
          uv pip install --index-url https://download.pytorch.org/whl/cpu torch
          uv pip install mne pyedflib pytest pytest-cov
          uv pip install -e . --no-deps

      # Real-data tests need the external EEG mounts (~419 GB). They skip
      # themselves when absent, which is the case in CI.
      - name: Test with coverage
        run: |
          uv run pytest -q -m "not realdata" \
            --cov=src/bci_eeg_to_text \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-report=html:htmlcov \
            --junitxml=junit.xml

      - name: Coverage summary
        if: always()
        run: |
          {
            echo "## Coverage"
            echo
            echo '```'
            uv run coverage report --skip-covered
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Keep the reports even when tests fail, so a regression can be
      # diagnosed from the artifacts rather than re-run locally.
      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            coverage.xml
            junit.xml
            htmlcov/
          if-no-files-found: warn
