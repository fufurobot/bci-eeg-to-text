name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install 3.13
      - name: Lint
        run: |
          uv venv
          uv pip install ruff
          uv run ruff check src tests
          uv run ruff format --check src tests

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install 3.13

      # CI has no GPU, so install CPU-only PyTorch instead of the project's
      # default CUDA index. The CUDA wheels are also several GB larger.
      #
      # --no-config is required: pyproject.toml pins torch to the CUDA index via
      # [tool.uv.sources] for local GPU work, and that pin overrides
      # --index-url. Without it this step silently installed torch 2.7.1 with CUDA libraries,
      # so CI was downloading 863 MB of CUDA libraries it cannot use and was not
      # testing the CPU build its comment promised.
      - name: Install dependencies
        run: |
          uv venv
          uv pip install --no-config --index-url https://download.pytorch.org/whl/cpu torch
          uv pip install --no-config mne pyedflib pytest pytest-cov
          uv pip install --no-config transformers
          uv pip install --no-config -e . --no-deps
          # Record what actually got installed; a mismatch here explains
          # otherwise inexplicable numerical differences between runs.
          uv run python -c "import torch, transformers; print('torch', torch.__version__); print('transformers', transformers.__version__)"

      # Real-data tests need the external EEG mounts (~419 GB). They skip
      # themselves when absent, which is the case in CI.
      # The backbone tests build tiny checkpoints locally instead of
      # downloading them, so they run without network access.
      - name: Test with coverage
        env:
          HF_HUB_OFFLINE: "1"
        run: |
          uv run pytest -q -m "not realdata" \
            --cov=src/bci_eeg_to_text \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-report=html:htmlcov \
            --junitxml=junit.xml

      - name: Coverage summary
        if: always()
        run: |
          {
            echo "## Coverage"
            echo
            echo '```'
            uv run coverage report --skip-covered
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Keep the reports even when tests fail, so a regression can be
      # diagnosed from the artifacts rather than re-run locally.
      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            coverage.xml
            junit.xml
            htmlcov/
          if-no-files-found: warn
