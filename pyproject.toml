[project]
name = "bci-eeg-to-text"
version = "0.1.0"
description = "CTC-based EEG-to-text decoding on the Chisco imagined-speech dataset"
readme = "README.md"
authors = [
    { name = "fufu", email = "fufurobot@outlook.com" }
]
requires-python = ">=3.13"
dependencies = [
    "mne>=1.13.2",
    "pyedflib>=0.1.42",
    "torch>=2.7.1",
    "torchaudio==2.7.1",
    "torchvision==0.22.1",
    "transformers>=5.19.0",
]

[project.scripts]
bci-eeg-to-text = "bci_eeg_to_text.cli:main"
# Short alias. `bci <command>` is the form used throughout the README and the
# benchmark interface, and typing the long name for every subcommand is noise.
bci = "bci_eeg_to_text.cli:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
torch = { index = "pytorch" }
torchvision = { index = "pytorch" }
torchaudio = { index = "pytorch" }

[[tool.uv.index]]
name = "pytorch"
# CUDA 12.6 wheels from the CERNET mirror. Two reasons for the mirror rather
# than PyTorch's own host: download.pytorch.org is not reachable from all the
# machines this runs on, and this is the index the cluster machine already
# uses. cu126 stays below CUDA 13, and supports sm_61 (GTX 1050) as well as
# newer cards.
url = "https://mirrors.cernet.edu.cn/pytorch/whl/cu126"

[dependency-groups]
dev = [
    "accelerate>=1.15.0",
    "mlflow>=3.17.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.10",
    "tensorboard>=2.21.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "realdata: requires the read-only eeg-text-bci-data dataset mount",
    "slow: long-running test",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
